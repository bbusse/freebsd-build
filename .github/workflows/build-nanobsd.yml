name: Build NanoBSD

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    name: Build NanoBSD
    uses: bbusse/github-workflows/.github/workflows/build-nanobsd.yml@dev
    with:
      release: "15.1"
      image_builder_ref: dev

  # amd64 only: NanoBSD's legacy layout (boot0sio MBR + BSD label) has no
  # EFI boot path, so the arm64 image can't boot on qemu's virt machine.
  # build's arm64 leg failing shouldn't skip this: run whenever the
  # workflow wasn't cancelled, and let the artifact download fail loudly
  # if amd64 itself didn't produce one
  test-boot:
    name: Boot disk image under qemu
    needs: build
    if: ${{ !cancelled() }}
    uses: bbusse/github-workflows/.github/workflows/run-tests-bash-unit.yml@dev
    with:
      test_files: tests/test_boot_qemu_nanobsd.sh
      install_qemu_deps: true
      enable_kvm: true
      download_artifact_name: nanobsd-amd64-full-${{ github.run_number }}
      disk_image: nanobsd-amd64-full.img
