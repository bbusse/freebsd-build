name: Build FreeBSD

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    name: Build FreeBSD ${{ matrix.release }}
    strategy:
      matrix:
        release: ["15.1"]
    uses: bbusse/github-workflows/.github/workflows/build-freebsd.yml@dev
    with:
      release: ${{ matrix.release }}
      image_builder_ref: dev

  # arm64 isn't boot-tested yet - qemu-system-aarch64 needs a different
  # machine type/firmware than the amd64 invocation below
  test-boot:
    name: Boot mini-memstick image under qemu
    needs: build
    strategy:
      matrix:
        release: ["15.1"]
    uses: bbusse/github-workflows/.github/workflows/run-tests-bash-unit.yml@dev
    with:
      test_files: tests/test_boot_qemu_freebsd.sh
      install_klue_test_deps: false
      install_qemu_deps: true
      download_artifact_name: freebsd-${{ matrix.release }}-amd64-mini-memstick-${{ github.run_number }}
